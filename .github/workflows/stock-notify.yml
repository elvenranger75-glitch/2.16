name: 한국 주식 시세 알림

on:
  schedule:
    # KST 평일 09:00~09:55 5분 간격 = UTC 월~금 00:00~00:55 (KST = UTC+9)
    - cron: '*/5 0 * * 1-5'
  workflow_dispatch:
    inputs:
      stock_codes:
        description: '종목 코드 (콤마 구분, 비우면 vars.STOCK_CODES 또는 기본 008060)'
        required: false
        default: ''
      skip_holidays:
        description: '한국 공휴일/휴장일 스킵 (true/false)'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: holidays 패키지 설치
        run: pip install --quiet holidays

      - name: 시세 조회 후 ntfy 푸시
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER || 'https://ntfy.sh' }}
          STOCK_CODES: ${{ github.event.inputs.stock_codes || vars.STOCK_CODES || '008060' }}
          SKIP_HOLIDAYS: ${{ github.event.inputs.skip_holidays || 'true' }}
        run: python scripts/notify_stock.py
